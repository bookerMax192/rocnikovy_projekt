<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — QuestForge</title>
    <!-- Используем тот же файл стилей! -->
    <link rel="stylesheet" href="/styles/sign.css">
</head>
<body class="auth-page">

    <!-- Плавающая шапка (без белого фона) -->
    <header class="auth-header">
        <div class="container header-content">
            <a href="index.html" class="logo text-light">
                <img src="/img/logo.png" alt="QuestForge Logo">
                QuestForge
            </a>
            
            <div class="header-actions">
                <span class="lang-switch text-light">EN</span>
            </div>
        </div>
    </header>

    <!-- Секция с формой -->
    <main class="auth-layout">
        <div class="auth-card">
            <h2>SIGN UP</h2>
            
            <form action="#">
                <!-- Добавлено поле Email -->
                <div class="form-group">
                    <input type="email" class="form-control" placeholder="Email Address" required>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Username" required>
                </div>
                
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="Password" required>
                </div>
                
                <!-- Добавлено поле подтверждения пароля -->
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="Confirm Password" required>
                </div>
                
                <!-- Изменен текст кнопки -->
                <button type="submit" class="btn btn-gold w-100">Create Account</button>
            </form>
            
            <!-- <button type="button" class="btn btn-outline w-100 btn-google">
                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google Logo">
                Sign Up With Google
            </button> -->
            
            <div class="auth-links">
                <p>Already Have An Account? <a href="/login.html" class="accent-link">Sign In</a></p>
            </div>
        </div>
    </main>

</body>
</html>
