<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — QuestForge</title>
    <link rel="stylesheet" href="/styles/sign.css">
</head>
<body class="auth-page">

    <header class="auth-header">
        <div class="container header-content">
            <a href="/" class="logo text-light">
                <img src="/img/logo.png" alt="QuestForge Logo">
                QuestForge
            </a>
            
            <div class="header-actions">
                <span class="lang-switch text-light">EN</span>
            </div>
        </div>
    </header>

    <main class="auth-layout">
        <div class="auth-card">
            <h2>SIGN IN</h2>

            <div class="form-group">
                <input type="email" id="login-email" class="form-control" placeholder="Email" required="">
            </div>
            <div class="form-group">
                <input type="password" id="login-password" class="form-control" placeholder="Password" required="">
            </div>

            <p class="error-msg" id="login-error">Wrong email or password.</p>

            <button class="btn btn-gold w-100" id="login-btn">Log In</button>            
            <div class="auth-links">
                <a href="#">Forgot Password?</a>
                <p>Don't Have An Account Yet? <a href="/register.html" class="accent-link">Sign Up</a></p>
            </div>
        </div>
    </main>

    <script>
        // Если уже залогинен — сразу на страницу персонажей
        if (localStorage.getItem('token')) {
            window.location.href = '/characters';
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorEl  = document.getElementById('login-error');
            const btn      = document.getElementById('login-btn');

            if (!email || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Сохраняем токен и данные пользователя
                    localStorage.setItem('token',     data.token);
                    localStorage.setItem('userName',  data.user_name);
                    localStorage.setItem('role',      data.role);

                    // Переходим на страницу персонажей
                    window.location.href = '/characters';
                } else {
                    errorEl.textContent = data.error || 'Wrong email or password.';
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = 'Something went wrong. Try again.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });

        // Логин по Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });
    </script>

</body>
</html>
