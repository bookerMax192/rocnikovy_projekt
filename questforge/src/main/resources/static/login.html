<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — QuestForge</title>
    <link rel="stylesheet" href="/styles/sign.css">
</head>
<body class="auth-page">

    <header class="auth-header">
        <div class="container header-content">
            <a href="index.html" class="logo text-light">
                <img src="/img/logo.png" alt="QuestForge Logo">
                QuestForge
            </a>
            
            <div class="header-actions">
                <span class="lang-switch text-light">EN</span>
            </div>
        </div>
    </header>

    <main class="auth-layout">
        <div class="auth-card">
            <h2>SIGN IN</h2>
            
            <form action="#">
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="password" required>
                </div>
                
                <button type="submit" class="btn btn-gold w-100">Log In</button>
            </form>
            
            <!-- <button type="button" class="btn btn-outline w-100 btn-google">
                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google Logo">
                Continue With Google
            </button> -->
            
            <div class="auth-links">
                <a href="#">Forgot Password?</a>
                <p>Don't Have An Account Yet? <a href="/register.html" class="accent-link">Sign Up</a></p>
            </div>
        </div>
    </main>

</body>
</html>
