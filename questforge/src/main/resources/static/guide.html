<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules & Guides — QuestForge</title>
    <link rel="stylesheet" href="/styles/guides.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/footer.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="/" class="logo">
                <img src="/img/logo.png" alt="QuestForge Logo">
                QuestForge
            </a>
            
            <input type="checkbox" id="mobile-menu" class="menu-checkbox">
            
            <nav class="nav-links">
                <a href="/characters">CHARACTERS</a>
                <a href="/guides">GUIDES</a>
            </nav>
            
            <div class="header-actions">
                <span class="lang-switch">EN</span>

                <!-- Если не залогинен -->
                <a href="/login" class="btn btn-primary" id="btn-signin">SIGN IN</a>

                <!-- Если залогинен — скрыто по умолчанию -->
                <span id="header-username" style="display:none; font-weight:600;"></span>
                <button class="btn btn-primary" id="btn-signout" 
                        style="display:none;">SIGN OUT</button>
                
                <label for="mobile-menu" class="burger-icon">☰</label>
            </div>
        </div>
    </header>

    <main class="page-content">
        <div class="container guide-layout">
            
            <aside class="guide-sidebar">
                <h3 class="sidebar-title">Contents</h3>
                <nav id="guide-nav-links" class="sidebar-nav">
                    </nav>
            </aside>

            <div class="guide-main-area">
                <h1 class="page-title colored-label" style="text-align: center; margin-bottom: 30px;">Core Rules & Options</h1>
                
                <div id="guides-content"></div>
            </div>

        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-block footer-info">
                <div class="footer-logo">QuestForge<span>.</span></div>
                <p>Ваша кузница героев и приключений в мире Dungeons & Dragons.</p>
            </div>
            <div class="footer-block footer-nav">
                <h4>Contacts</h4>
                <p>@questforge</p>
                <p>questforge@gmail.com</p>
            </div>
            <div class="footer-block footer-nav">
                <h4>Help</h4>
                <ul class="footer-links">
                    <li><a href="#">Support</a></li>
                    <li><a href="#">FAQ</a></li>
                </ul>
            </div>
        </div>
        <div class="container footer-copyright">
            <p>Copyright © 2025 QuestForge. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/rules.js"></script>
</body>
</html>
